info:
  name: Экспорт журнала аудита (без сессии)
  type: http
  seq: 8
http:
  method: GET
  url: '{{baseUrl}}/admin/shipment-audit/export'
settings:
  followRedirects: false
examples:
  - name: '401'
    request:
      method: GET
      url: http://127.0.0.1:4000/api/v1/admin/shipment-audit/export
    response:
      status: 401
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHENTICATED",
              "message": "Войдите в аккаунт."
            }
          }
