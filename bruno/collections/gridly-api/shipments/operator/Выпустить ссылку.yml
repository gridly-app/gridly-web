info:
  name: Выпустить ссылку
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/warehouses/{{warehouseId}}/orders/{{orderId}}/shipment/share-link'
  headers:
    - name: Authorization
      value: Bearer {{accountToken}}
    - name: Idempotency-Key
      value: '{{idempotencyKey}}'
  body:
    type: json
    data: |-
      {
        "expires_at": "{{expiresAt}}"
      }
settings:
  followRedirects: false
examples:
  - name: '501'
    request:
      method: POST
      url: http://127.0.0.1:4000/api/v1/warehouses/warehouse-demo/orders/order-out-2087/shipment/share-link
      headers:
        - name: Authorization
          value: Bearer bruno-account-token
        - name: Idempotency-Key
          value: shipment-link-example-1
      body:
        type: json
        data: |-
          {
            "expires_at": "2027-01-01T00:00:00Z"
          }
    response:
      status: 501
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "STATIC_MOCK",
              "message": "Статический мок не сохраняет изменения."
            }
          }
