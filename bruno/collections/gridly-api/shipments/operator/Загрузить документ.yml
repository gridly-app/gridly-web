info:
  name: Загрузить документ
  type: http
  seq: 6
http:
  method: POST
  url: '{{baseUrl}}/warehouses/{{warehouseId}}/orders/{{orderId}}/shipment/documents'
  headers:
    - name: Authorization
      value: Bearer {{accountToken}}
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
      - name: name
        type: text
        value: Накладная
      - name: upload_request_id
        type: text
        value: 94172712-7cbc-4d89-a3a0-d9f809108292
      - name: published
        type: text
        value: "false"
      - name: category
        type: text
        value: transport
      - name: previous_document_id
        type: text
        value: ''
        disabled: true
settings:
  followRedirects: false
