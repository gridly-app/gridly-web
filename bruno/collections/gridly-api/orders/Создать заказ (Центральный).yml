  url: '{{baseUrl}}/warehouses/warehouse-demo/orders'
  body:
    type: json
    data: |-
      {
        "kind": "outbound",
        "counterparty_text": "Тестовый контрагент",
        "lines": [
          {
            "product_id": "prod-coffee",
            "quantity": 2
          }
        ],
        "confirm_unload": false,
        "confirm_pick": false,
        "confirm_putaway": false,
        "confirm_load": false
      }
