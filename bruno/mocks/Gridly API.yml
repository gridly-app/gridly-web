info:
  name: Gridly API
  type: mock
mock:
  port: 4000
routes:
  - name: Warehouses — unavailable
    request:
      method: GET
      url: /api/v1/warehouses
    response:
      status: 503
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "message": "Тестовая недоступность API"
            }
          }
    rules:
      operator: AND
      conditions:
        - target: header
          key: x-gridly-scenario
          operator: equals
          value: unavailable
  - name: Warehouses — empty
    request:
      method: GET
      url: /api/v1/warehouses
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [],
            "total": 0
          }
    rules:
      operator: AND
      conditions:
        - target: header
          key: x-gridly-scenario
          operator: equals
          value: empty
  - name: Login — admin
    request:
      method: POST
      url: /api/v1/auth/login
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access_token": "bruno-account-token",
            "user": {
              "login": "admin@gridly.local"
            }
          }
    rules:
      operator: AND
      conditions:
        - target: body
          key: login
          operator: equals
          value: admin@gridly.local
        - target: body
          key: password
          operator: equals
          value: gridly-demo
  - name: Login — invalid credentials
    request:
      method: POST
      url: /api/v1/auth/login
    response:
      status: 401
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "INVALID_CREDENTIALS",
              "message": "Используйте admin@gridly.local и пароль gridly-demo."
            }
          }
  - name: Refresh account session
    request:
      method: POST
      url: /api/v1/auth/refresh
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access_token": "bruno-account-token"
          }
  - name: Logout
    request:
      method: POST
      url: /api/v1/auth/logout
    response:
      status: 204
  - name: Registration — unsupported in static mock
    request:
      method: POST
      url: /api/v1/auth/register
    response:
      status: 501
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "message": "Статический мок Bruno не сохраняет новые аккаунты. Используйте тестовый вход."
            }
          }
  - name: Create demo session
    request:
      method: POST
      url: /api/v1/demo/sessions
    response:
      status: 201
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "session_id": "bruno-demo-session",
            "access_token": "bruno-demo-token",
            "expires_at": "2099-01-01T00:00:00Z",
            "initial_warehouse_id": "warehouse-demo"
          }
  - name: Restore demo session
    request:
      method: GET
      url: /api/v1/demo/session
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "session_id": "bruno-demo-session",
            "access_token": "bruno-demo-token",
            "expires_at": "2099-01-01T00:00:00Z",
            "initial_warehouse_id": "warehouse-demo"
          }
  - name: End demo session
    request:
      method: DELETE
      url: /api/v1/demo/session
    response:
      status: 204
