# Порядок ответов, шаблоны путей и правила для Bruno Mock Server.
- file: warehouses/Список складов (API недоступен).yml
  rules:
    operator: AND
    conditions:
      - target: header
        key: x-gridly-scenario
        operator: equals
        value: unavailable
- file: warehouses/Список складов (пусто).yml
  rules:
    operator: AND
    conditions:
      - target: header
        key: x-gridly-scenario
        operator: equals
        value: empty
- file: auth/Вход в аккаунт.yml
  rules:
    operator: AND
    conditions:
      - target: body
        key: login
        operator: equals
        value: admin@gridly.local
      - target: body
        key: password
        operator: equals
        value: gridly-demo
